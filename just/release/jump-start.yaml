---
description: |
  A local release flow for any language, driven by [just](https://github.com/casey/just).
  Edit three commands at the top of the justfile (test, bump, publish; node
  and python presets included), add notes under "## Unreleased" in
  CHANGELOG.md, then:

  ```
  just release 0.1.0
  ```

  Checks everything before changing anything (version, branch, clean tree,
  changelog, sync with origin, gh auth), then tests, bumps, updates the
  changelog, commits, tags, publishes, pushes, and creates the GitHub
  release. If it fails before publish, `just unrelease VERSION` undoes it;
  after publish, `just release-finish VERSION` finishes it.

  Needs git, [gh](https://cli.github.com), just, bash and awk. Runs on stock
  macOS. Tests for the flow itself: `tests/run`.
defaultDir: .
mainFile: justfile
